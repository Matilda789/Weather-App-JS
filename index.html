<!DOCTYPE html>
<html>
    <head>
        <meta charset = "utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Weather App</title>
        <link href="styles/style.css" rel="stylesheet">
        <link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght,HEXP@160..700,12&display=swap" rel="stylesheet">
    </head>
    <body>
        
        <div class="app">
            <h1>Weather 🌦️</h1>
            <div class="search">
                <input type="text" id="city-input" placeholder="Enter your city">
                <button id="search-btn">Search 🔍</button>
            </div>
            <div id="weather-info" class="weather-info"></div>
            <div id="error" class="error"></div>
        </div>
        <script src="scripts/main.js"></script>
    </body>
</html>
